<footer class="statusbar mono">
  <div class="sb-left">
    <span class="sb-item brand"><span class="git-dot"></span> main</span>
    <span class="sb-item">↑ open to work</span>
    <span class="sb-item hide-sm">{{ links.location }}</span>
  </div>
  <div class="sb-right">
    <span class="sb-item hide-sm">UTF-8</span>
    <span class="sb-item hide-sm">C#</span>
    <span class="sb-item">§ {{ activeFile() }}</span>
    <span class="sb-item theme-ind">◎ {{ theme() }}</span>
  </div>
</footer>
